name: Apply Plant Watch Sync

on:
  push:
    branches: [main]
    paths:
      - 'plant-watch/.sync/latest/manifest.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct latest Plant Watch bundle
        shell: bash
        run: |
          set -euo pipefail
          cat plant-watch/.sync/latest/part-* > /tmp/plant-watch-core.tar.gz.b64
          base64 --decode /tmp/plant-watch-core.tar.gz.b64 > /tmp/plant-watch-core.tar.gz
          tar -xzf /tmp/plant-watch-core.tar.gz -C plant-watch
      - name: Commit applied source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plant-watch
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Apply MyGardener pre-Swift hardening source'
          git push origin HEAD:main
