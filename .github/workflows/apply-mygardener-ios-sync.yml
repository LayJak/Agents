name: Apply MyGardener iOS Sync

on:
  push:
    branches: [main]
    paths:
      - '.ios-sync/manifest.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct native iOS production candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .ios-sync/part-* > /tmp/mygardener-ios.zip.b64
          base64 --decode /tmp/mygardener-ios.zip.b64 > /tmp/mygardener-ios.zip
          echo "d62b39d3409be335c54faad9b83069b9ccd6638df1e799ae93f0682dc3fa0c75  /tmp/mygardener-ios.zip" | sha256sum -c -
          rm -rf /tmp/mygardener-ios
          mkdir -p /tmp/mygardener-ios
          unzip -q /tmp/mygardener-ios.zip -d /tmp/mygardener-ios
          rm -rf MyGardener-iOS
          cp -a /tmp/mygardener-ios/MyGardener-iOS ./MyGardener-iOS
      - name: Commit native production candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A MyGardener-iOS
          if git diff --cached --quiet; then
            echo 'No native source changes to commit.'
            exit 0
          fi
          git commit -m 'Apply MyGardener native production candidate'
          git push origin HEAD:main
